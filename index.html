<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Photo Gallery</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans:wght@400;600&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="./styles/tokens.css" />
    <link rel="stylesheet" href="./styles/base.css" />
    <link rel="stylesheet" href="./styles/main.css" />
  </head>
  <body>
    <main>
      <h1 id="main-title">Photo Gallery</h1>

      <section id="gallery">
        <button type="button" id="featured-button" aria-label="View image fullscreen">
          <img id="featured-image" src="" alt="" />
        </button>
        <p id="featured-caption"></p>

        <div class="thumbnails" id="thumbnails" role="listbox" aria-label="Gallery thumbnails"></div>
      </section>
    </main>

    <div class="lightbox" id="lightbox" hidden>
      <button
        type="button"
        class="lightbox-close"
        id="lightbox-close"
        aria-label="Close fullscreen view"
      >
        &times;
      </button>
      <img id="lightbox-image" src="" alt="" />
      <p id="lightbox-caption"></p>
    </div>

    <script type="module" src="./scripts/main.js"></script>
  </body>
</html>
